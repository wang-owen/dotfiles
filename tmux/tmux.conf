# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -s extended-keys on
set -g default-terminal "tmux-256color"
set -g history-limit 10000
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g renumber-windows on

# Vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Image support
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM

# Windows
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar
set -g status 2
set -g status-style "bg=default,fg=default"
set -g status-left-length 20
set -g status-left-style "bold"
set -g status-left "#S "
set -g status-right-style "fg=brightblack"
set -g status-right "%H:%M"
set -gu status-format
set -gF status-format[1] "#{status-format[0]}"
set -g status-format[0] "#[fg=brightblack]#{R:─,#{client_width}}"
setw -g window-status-style "fg=brightblack"
setw -g window-status-current-style "bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-status top
set -g pane-border-indicators off
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=default"
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# Messages and copy mode
set -g message-style "bg=default,fg=default,bold"
set -g message-command-style "bg=default,fg=default"
set -g mode-style "reverse"
set -g copy-mode-match-style "reverse"
set -g copy-mode-current-match-style "reverse,bold"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
