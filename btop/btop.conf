#? Only overrides of built-in defaults; `btop --default-config` shows the rest.

#* Look
color_theme = "gruvbox_dark_v2"
theme_background = false          # let ghostty's bg + blur show through

#* Layout. Toggle presets with p / P.
#* 0: everything   1: cpu + procs   2: cpu/mem/net (no procs)   3: procs only
presets = "cpu:0:default,proc:0:default cpu:0:default,mem:0:default,net:0:default proc:0:default"

#* Behaviour
vim_keys = true                   # hjkl/gG; shift+h help, shift+k kill
update_ms = 1500
save_config_on_exit = false       # config lives in dotfiles; don't let btop rewrite it

#* CPU
clock_format = "%H:%M"

#* Disks
disks_filter = "exclude=/System/Volumes/VM /System/Volumes/Preboot /System/Volumes/Update /System/Volumes/xarts /System/Volumes/iSCPreboot /System/Volumes/Hardware /System/Volumes/Data/home /Volumes/Recovery"

#* Processes
proc_sorting = "cpu direct"
proc_gradient = false
proc_per_core = true              # % of one core, can exceed 100% (matches Activity Monitor)
proc_filter_kernel = true
