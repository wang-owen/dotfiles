#? btop v1.4.7 — only non-default-worthy settings documented; see `btop --help` / in-app menu (Esc) for the rest.

#* Look
color_theme = "gruvbox_dark_v2"
theme_background = false          # let ghostty's bg + blur show through
truecolor = true
rounded_corners = true
graph_symbol = "braille"
terminal_sync = true

#* Layout. Toggle presets with p / P.
#* 0: everything   1: cpu + procs   2: cpu/mem/net (no procs)   3: procs only
shown_boxes = "cpu mem net proc"
presets = "cpu:0:default,proc:0:default cpu:0:default,mem:0:default,net:0:default proc:0:default"

#* Behaviour
vim_keys = true                   # hjkl/gG; shift+h help, shift+k kill
update_ms = 1500
save_config_on_exit = false       # config lives in dotfiles; don't let btop rewrite it
background_update = true
log_level = "WARNING"

#* CPU
cpu_single_graph = false
cpu_invert_lower = true
cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
show_uptime = true
show_cpu_freq = true
show_cpu_watts = true
check_temp = true
show_coretemp = true
temp_scale = "celsius"
show_battery = true
show_battery_watts = true
clock_format = "%H:%M"

#* GPU
show_gpu_info = "Auto"
shown_gpus = "nvidia amd intel apple"

#* Memory / disks
mem_graphs = true
show_swap = true
swap_disk = true
show_disks = true
only_physical = true
use_fstab = true
show_io_stat = true
disks_filter = "exclude=/System/Volumes/VM /System/Volumes/Preboot /System/Volumes/Update /System/Volumes/xarts /System/Volumes/iSCPreboot /System/Volumes/Hardware /System/Volumes/Data/home /Volumes/Recovery"
base_10_sizes = false

#* Network
net_auto = true
net_sync = true
base_10_bitrate = "Auto"

#* Processes
proc_sorting = "cpu direct"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = false
proc_per_core = true              # % of one core, can exceed 100% (matches Activity Monitor)
proc_mem_bytes = true
proc_cpu_graphs = true
proc_left = false
proc_filter_kernel = true
proc_aggregate = false
proc_follow_detailed = true
