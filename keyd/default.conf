# Mac-style modifiers: Alt = Cmd, Super = Option
# After editing: sudo keyd.rvaiya reload

[ids]
*

[main]
leftalt = layer(cmd)
rightalt = layer(cmd)
leftmeta = layer(opt)
rightmeta = layer(opt)

# Cmd: Ctrl unless listed
[cmd:C]
# Copy/paste that also works in terminals
c = C-insert
v = S-insert
x = S-delete
left = home
right = end
up = C-home
down = C-end
# Delete to start of line
backspace = macro(S-home backspace)
# Sway system actions ($sys)
space = M-A-space
enter = M-A-enter
q = M-A-q
tab = M-A-tab
esc = M-A-esc

[cmd+shift]
left = S-home
right = S-end
up = C-S-home
down = C-S-end
# Screenshots, exit sway
4 = M-A-S-4
3 = M-A-S-3
e = M-A-S-e

# Clear screen in ghostty
[control+cmd]
l = C-M-l

# Option: Super, except text editing keys
[opt:M]
backspace = C-backspace
delete = C-delete
left = C-left
right = C-right

[opt+shift]
left = C-S-left
right = C-S-right
# nvim copy line up/down
up = A-S-up
down = A-S-down
