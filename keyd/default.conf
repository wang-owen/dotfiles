# Mac-style modifiers: Alt = Cmd, Super = Option
# Some keys send stand-ins that other configs translate back:
#   ghostty/linux  copy/paste, delete to line start, delete word, clear screen
#   sway/config    $sys (Super+Alt) system actions
# After editing: sudo keyd.rvaiya reload

[ids]
*

[main]
leftalt = layer(cmd)
rightalt = layer(cmd)
leftmeta = layer(opt)
rightmeta = layer(opt)

# ---Cmd: Ctrl, except the keys below---

[cmd:C]
# Copy/paste/cut that also work in terminals (ghostty maps these back)
c = C-insert
v = S-insert
x = S-delete

# Line/document navigation
left = home
right = end
up = C-home
down = C-end
# Delete to line start (ghostty: shift+home -> ctrl+u)
backspace = macro(S-home backspace)

# Switch tabs (Linux apps use Alt+N, not Ctrl+N)
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9

# Sway system actions ($sys)
space = M-A-space
enter = M-A-enter
q = M-A-q
tab = M-A-tab
esc = M-A-esc

[cmd+shift]
# Select to line/document edge
left = S-home
right = S-end
up = C-S-home
down = C-S-end
# Sway: screenshots, exit
4 = M-A-S-4
3 = M-A-S-3
e = M-A-S-e

[control+cmd]
# Clear screen (ghostty: tmux prefix + C-l)
l = C-M-l

# ---Option: Super, except text-editing keys---

[opt:M]
# Word delete/jump
backspace = C-backspace
delete = C-delete
left = C-left
right = C-right

[opt+shift]
# Select by word (ghostty unbinds these from tab switching)
left = C-S-left
right = C-S-right
# nvim copy line up/down
up = A-S-up
down = A-S-down
